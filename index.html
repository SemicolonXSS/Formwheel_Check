<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FormWheel Checklist</title>

<style>
:root{
  --bg:#f7f8fc;
  --card:#fff;
  --text:#20242b;
  --muted:#737985;
  --line:#e6e8ee;
  --accent:#4f46e5;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

header{
  position:sticky;
  top:0;
  z-index:10;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}

.header-inner{
  max-width:1100px;
  margin:auto;
  padding:16px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
}

.logo{
  font-size:21px;
  font-weight:800;
  letter-spacing:-.5px;
}

.logo span{
  color:var(--accent);
}

.home{
  color:var(--muted);
  text-decoration:none;
  font-size:14px;
}

main{
  max-width:1100px;
  margin:0 auto;
  padding:28px 20px 60px;
}

.hero{
  margin-bottom:22px;
}

h1{
  margin:0 0 8px;
  font-size:30px;
  letter-spacing:-1px;
}

.hero p{
  margin:0;
  color:var(--muted);
}

.progress-card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  padding:18px;
  margin:22px 0;
  box-shadow:0 5px 18px rgba(20,25,40,.04);
}

.progress-top{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:center;
  margin-bottom:12px;
}

.progress-number{
  font-size:24px;
  font-weight:800;
}

.progress-label{
  font-size:13px;
  color:var(--muted);
}

.bar{
  height:10px;
  background:#eceef4;
  border-radius:999px;
  overflow:hidden;
}

.bar-fill{
  height:100%;
  width:0;
  background:var(--accent);
  border-radius:999px;
  transition:width .25s;
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:14px;
}

button{
  border:1px solid var(--line);
  background:#fff;
  color:var(--text);
  border-radius:10px;
  padding:9px 12px;
  cursor:pointer;
  font-weight:650;
}

button:hover{
  background:#f7f7fb;
}

button.primary{
  background:var(--accent);
  color:#fff;
  border-color:var(--accent);
}

.category{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  margin:12px 0;
  overflow:hidden;
}

.category-head{
  padding:15px 17px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  cursor:pointer;
}

.category-title{
  font-weight:800;
  flex:1;
}

.category-count{
  font-size:12px;
  color:var(--muted);
  white-space:nowrap;
}

.items{
  border-top:1px solid var(--line);
}

label.item{
  display:flex;
  align-items:flex-start;
  gap:11px;
  padding:11px 17px;
  cursor:pointer;
  border-bottom:1px solid #f0f1f5;
}

label.item:last-child{
  border-bottom:0;
}

label.item:hover{
  background:#fafaff;
}

input[type=checkbox]{
  width:18px;
  height:18px;
  margin:1px 0 0;
  accent-color:var(--accent);
  cursor:pointer;
  flex:none;
}

.item-text{
  line-height:1.45;
}

.item.done .item-text{
  text-decoration:line-through;
  color:#9a9faa;
}

.chevron{
  transition:transform .2s;
  color:var(--muted);
}

.category.closed .chevron{
  transform:rotate(-90deg);
}

.category.closed .items{
  display:none;
}

.footer{
  text-align:center;
  color:var(--muted);
  font-size:13px;
  margin-top:30px;
}

#firebaseStatus{
  position:fixed;
  right:14px;
  bottom:14px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:12px;
  padding:9px 12px;
  font-size:12px;
  box-shadow:0 5px 18px rgba(20,25,40,.08);
  z-index:99;
}

@media(max-width:600px){

  h1{
    font-size:25px;
  }

  main{
    padding:22px 13px 45px;
  }

  .header-inner{
    padding:14px;
  }

  .category-head{
    padding:14px;
  }

  label.item{
    padding:11px 14px;
  }
}
</style>
</head>

<header>
  <div class="header-inner">

    <div class="logo">
      Form<span>Wheel</span> Checklist
    </div>

    <a
      class="home"
      href="https://semicolonxss.github.io/Formwheel/"
    >

    </a>

  </div>
</header>


<main>

  <section class="hero">

    <h1>🎡 FormWheel 개선 체크리스트</h1>

    <p>
      FormWheel 프로젝트의 개선 작업을 체크하고 진행률을 관리하세요.
    </p>

  </section>


  <section class="progress-card">

    <div class="progress-top">

      <div>

        <div
          class="progress-number"
          id="percent"
        >
          0%
        </div>

        <div
          class="progress-label"
          id="count"
        >
          0 / 0 완료
        </div>

      </div>

      <div
        class="progress-label"
        id="saveStatus"
      >
        Firebase 연결 중...
      </div>

    </div>


    <div class="bar">

      <div
        class="bar-fill"
        id="bar"
      ></div>

    </div>


    <div class="actions">

      <button
        class="primary"
        onclick="checkAll()"
      >
        전체 체크
      </button>

      <button
        onclick="uncheckAll()"
      >
        전체 해제
      </button>

      <button
        onclick="resetList()"
      >
        진행상태 초기화
      </button>

    </div>

  </section>


  <div id="checklist"></div>


  <div class="footer">
    체크 상태는 Firebase에 자동 저장됩니다.
  </div>

</main>

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

import {
  getDatabase,
  ref,
  onValue,
  set
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyBreTSe1m0-xlbF4aupnU5isRZCihR25IE",

  authDomain:
    "formwheel.firebaseapp.com",

  databaseURL:
    "https://formwheel-default-rtdb.firebaseio.com",

  projectId:
    "formwheel",

  storageBucket:
    "formwheel.firebasestorage.app",

  messagingSenderId:
    "431583088241",

  appId:
    "1:431583088241:web:74e0e34ea1e3e1170c55d0",

  measurementId:
    "G-T372YXDF8D"

};


const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

const checklistRef =
  ref(db, "formwheelChecklist");


window.firebaseChecklist = {
  db,
  checklistRef,
  set
};


showFirebaseStatus("🔄 Firebase 연결 중...");


onValue(
  checklistRef,

  snapshot => {

    const remoteData =
      snapshot.val();

    if(
      remoteData &&
      typeof remoteData === "object"
    ){

      state = remoteData;

    }else{

      state = {};

    }

    firebaseReady = true;

    showFirebaseStatus(
      "☑️ Firebase 연결됨 · 자동 저장"
    );

    render();

  },

  error => {

    console.error(
      "Firebase 오류:",
      error
    );

    firebaseReady = false;

    showFirebaseStatus(
      "❌ Firebase 연결 실패"
    );

  }

);

</script>

    "[P2] QR 생성의 외부 전송을 안내하거나 로컬 생성하기 · 완료 기준: 입력 내용의 외부 전송 여부를 안내하고 민감한 텍스트를 위한 로컬 생성 경로를 제공한다."
  ]
});

let state = {};

let firebaseReady = false;


function showFirebaseStatus(message){

  const el =
    document.getElementById(
      "firebaseStatus"
    );

  const save =
    document.getElementById(
      "saveStatus"
    );

  if(el){
    el.textContent = message;
  }

  if(save){
    save.textContent = message;
  }

}


function save(){

  updateProgress();

  if(
    firebaseReady &&
    window.firebaseChecklist
  ){

    window.firebaseChecklist
      .set(
        window.firebaseChecklist.checklistRef,
        state
      )
      .then(()=>{

        showFirebaseStatus(
          "☑️ 저장됨 · Firebase"
        );

      })
      .catch(error=>{

        console.error(
          "Firebase 저장 실패:",
          error
        );

        showFirebaseStatus(
          "❌ Firebase 저장 실패"
        );

      });

  }

}


function render(){

  const root =
    document.getElementById(
      "checklist"
    );

  root.innerHTML = "";

  let index = 0;


  for(
    const [category,items]
    of Object.entries(data)
  ){

    const section =
      document.createElement(
        "section"
      );

    section.className =
      "category";


    const categoryIndex = index;

    const head =
      document.createElement(
        "div"
      );

    head.className =
      "category-head";


    head.innerHTML = `

      <div class="category-title">
        ${category}
      </div>

      <div
        class="category-count"
        id="cat-${index}"
      >
        0 / ${items.length}
      </div>

      <div class="chevron">
        ⌄
      </div>

    `;


    head.addEventListener(
      "click",
      event=>{

        if(
          event.target.closest(
            "input"
          )
        ){
          return;
        }

        section.classList.toggle(
          "closed"
        );

      }
    );


    const list =
      document.createElement(
        "div"
      );

    list.className =
      "items";


    items.forEach(
      (item,i)=>{

        const id =
          category +
          "::" +
          i;


        const label =
          document.createElement(
            "label"
          );

        label.className =
          "item";


        const checkbox =
          document.createElement(
            "input"
          );

        checkbox.type =
          "checkbox";


        checkbox.checked =
          !!state[id];


        const span =
          document.createElement(
            "span"
          );

        span.className =
          "item-text";


        span.textContent =
          item;


        if(
          checkbox.checked
        ){

          label.classList.add(
            "done"
          );

        }


        checkbox.addEventListener(
          "change",
          ()=>{

            state[id] =
              checkbox.checked;

            label.classList.toggle(
              "done",
              checkbox.checked
            );

            save();

            updateCategory(
              category,
              categoryIndex,
              items.length
            );

          }
        );


        label.append(
          checkbox,
          span
        );


        list.appendChild(
          label
        );

      }
    );


    section.append(
      head,
      list
    );


    root.appendChild(
      section
    );


    updateCategory(
      category,
      index,
      items.length
    );


    index++;

  }


  updateProgress();

}


function updateCategory(
  category,
  index,
  total
){

  let done = 0;


  for(
    let i=0;
    i<total;
    i++
  ){

    if(
      state[
        category +
        "::" +
        i
      ]
    ){

      done++;

    }

  }


  const el =
    document.getElementById(
      "cat-" + index
    );


  if(el){

    el.textContent =
      `${done} / ${total}`;

  }

}


function allIds(){

  const ids = [];


  for(
    const [category,items]
    of Object.entries(data)
  ){

    items.forEach(
      (_,i)=>{

        ids.push(
          category +
          "::" +
          i
        );

      }
    );

  }


  return ids;

}


function updateProgress(){

  const ids =
    allIds();


  const done =
    ids.filter(
      id=>state[id]
    ).length;


  const percent =
    ids.length
      ? Math.round(
          done /
          ids.length *
          100
        )
      : 0;


  document.getElementById(
    "percent"
  ).textContent =
    percent + "%";


  document.getElementById(
    "count"
  ).textContent =
    `${done} / ${ids.length} 완료`;


  document.getElementById(
    "bar"
  ).style.width =
    percent + "%";

}


function checkAll(){

  allIds().forEach(
    id=>{
      state[id] = true;
    }
  );

  save();

  render();

}


function uncheckAll(){

  allIds().forEach(
    id=>{
      delete state[id];
    }
  );

  save();

  render();

}


function resetList(){

  if(
    confirm(
      "모든 체크 상태를 초기화할까요?"
    )
  ){

    state = {};

    save();

    render();

  }

}


render();

</script>

</body>
</html>
